; iOS 書き出しの設定。署名まわり（team_id / provisioning profile）は
; 各自の Apple Developer アカウントに依存するため空にしてある。
; 手順は docs/13-device-testing.md を参照。

[preset.0]

name="iOS"
platform="iOS"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter=""
export_path="../build/ios/PrisonDebt.ipa"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

application/app_store_team_id=""
application/bundle_identifier="com.example.prisondebt"
application/signature=""
application/short_version="0.1.0"
application/version="1"
application/min_ios_version="15.0"
application/targeted_device_family=2
application/export_method_debug=1
application/export_method_release=1
application/delete_old_export_files_unconditionally=true

; 横持ち固定（NFR-01）。縦向きは許可しない
application/landscape_launch_screens=true
application/portrait_launch_screens=false

capabilities/access_wifi=false
capabilities/push_notifications=false
capabilities/performance_gaming_tier=false
capabilities/performance_a12=false

user_data/accessible_from_files_app=false
user_data/accessible_from_itunes_sharing=false

; 本作はカメラもマイクも位置情報も使わない。権限を要求しない
privacy/camera_usage_description=""
privacy/microphone_usage_description=""
privacy/photolibrary_usage_description=""

icons/iphone_120x120=""
icons/iphone_180x180=""
icons/ipad_152x152=""
icons/ipad_167x167=""
icons/app_store_1024x1024=""
